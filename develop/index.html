<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // Pre-paint theme resolution to avoid a flash of the wrong theme.
      // Mirrors readAppearance/resolveAppearance in src/ui/model.ts.
      try {
        const stored = localStorage.getItem("appearance");
        const legacy = localStorage.getItem("dark-mode");
        const preference = ["light", "dark", "system"].includes(stored)
          ? stored
          : legacy === "true"
            ? "dark"
            : legacy === "false"
              ? "light"
              : "system";
        const theme =
          preference === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : preference;
        document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>QUICKSILVER Configurator</title>
    <meta
      name="description"
      content="Configurator for the QUICKSILVER flight-controller firmware"
    />
    <link rel="icon" href="/develop/favicon.svg" type="image/svg+xml" />
    <link
      rel="alternate icon"
      href="/develop/favicon.ico"
      type="image/png"
      sizes="16x16"
    />
    <link rel="mask-icon" href="/develop/favicon.svg" color="#FFFFFF" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#202327"
      media="(prefers-color-scheme: dark)"
    />

    <link rel="stylesheet" crossorigin href="/develop/assets/index-C9Zdv-J1.css">
  <link rel="manifest" href="/develop/manifest.webmanifest"></head>

  </body>
</html>
