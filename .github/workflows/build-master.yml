name: build-master
on:
  push:
    branches:
      - "master"
    tags:
      - v*

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Test Pages publishing
        run: node --test script/pages.test.mjs

      - name: cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-develop-node_modules

      - name: install npm packages
        run: npm install

      - name: build
        run: |
          npm run build:gh-pages
          echo 'config.bosshobby.com' > docs/CNAME

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gh-pages
          path: docs

  linux:
    runs-on: ubuntu-latest
    needs: web
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-develop-node_modules

      - name: install npm packages
        run: npm install

      - name: build
        run: |
          npm run build:linux

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quic-config-linux
          path: build/*.AppImage

  windows:
    runs-on: windows-latest
    needs: web
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-develop-node_modules

      - name: install npm packages
        run: npm install

      - name: build
        run: |
          npm run build:windows

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quic-config-windows
          path: build/*.exe

  mac:
    runs-on: macos-latest
    needs: web
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-develop-node_modules

      - name: install npm packages
        run: npm install

      - name: build
        run: |
          npm run build:mac

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quic-config-mac
          path: build/*.dmg

  release:
    runs-on: ubuntu-latest
    needs: [linux, windows, mac]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4

      - name: prepare release notes
        run: |
          awk '
            $0 == "## " tag { in_section = 1; next }
            in_section && /^## / { exit }
            in_section && !seen_content && $0 == "" { next }
            in_section { seen_content = 1 }
            in_section { print }
          ' tag="${{ github.ref_name }}" CHANGELOG.md > RELEASE.md

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE.md
          files: |
            quic-config-linux/*
            quic-config-mac/*
            quic-config-windows/*
