appId: com.bosshobby.config
productName: QUICKSILVER Configurator
# The iOS app icon on macOS's icon grid, see electron/icon.png.
icon: electron/icon.png
directories:
  output: build
  buildResources: public
files:
  - "out/**/*"
  - package-lock.json
  - package.json
  - README.md
mac:
  extendInfo:
    NSBluetoothAlwaysUsageDescription: Connect to your flight controller or radio bridge to read and save settings.
win:
  target: portable
  artifactName: ${name}-${version}.${ext}
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
  artifactName: ${name}-${version}.${ext}
