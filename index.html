<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      try {
        const stored = localStorage.getItem("appearance");
        const legacy = localStorage.getItem("dark-mode");
        const preference = ["light", "dark", "system"].includes(stored)
          ? stored
          : legacy === "true"
            ? "dark"
            : legacy === "false"
              ? "light"
              : "system";
        const theme =
          preference === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : preference;
        document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>QUICKSILVER Configurator</title>
    <meta
      name="description"
      content="Configurator for the QUICKSILVER flight-controller firmware"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      rel="alternate icon"
      href="/favicon.ico"
      type="image/png"
      sizes="16x16"
    />
    <link rel="mask-icon" href="/favicon.svg" color="#FFFFFF" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#3c7317" />
  </head>

  <body>
    <div id="app"></div>
    <script>
      window.global = globalThis;
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
